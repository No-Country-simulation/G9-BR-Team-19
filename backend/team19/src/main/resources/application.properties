spring.application.name=team19

# busca a variável da url pro Docker. Se não achar, usa o localhost como padrão
model.python.url=${MODEL_PYTHON_URL:http://127.0.0.1:8000/conteudo}

# busca a variável do Docker. Se não achar, usa false como padrão
model.python.mock-enabled=${MODEL_PYTHON_MOCK_ENABLED:false}

spring.datasource.url=jdbc:postgresql://localhost/techmind_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.drive-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true