<div class="modal-overlay">

    <div class="auth-modal">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="modal-cadastro.css">

        <!-- Lado esquerdo -->

        <div class="modal-left">

            <h2>Seja bem-vindo(a)</h2>

            <p>
                Para realizar as consultas é necessário preencher corretamente o
                formulário ao lado com os respectivos dados cadastrais.
            </p>

            <img src="https://github.com/No-Country-simulation/G9-BR-Team-19/blob/feature/frontend/frontend/assets/knowledge.png?raw=true"
                 alt="Ilustração">

        </div>

        <!-- Lado direito -->

        <div class="modal-right">

            <button class="close-modal">&times;</button>

            <h1>Cadastrar</h1>

            <span>
                Já possui uma conta?
                <a href="#">Entrar</a>
            </span>

            <form>

                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="text"
                        placeholder="Nome de usuário">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        placeholder="Email">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        placeholder="Senha">
                </div>

                <button class="submit-btn">
                    Cadastrar
                </button>

            </form>

        </div>

    </div>

</div>
