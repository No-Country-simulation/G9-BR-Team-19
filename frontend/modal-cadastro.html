<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - TechMind</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="modal.css">
</head>
<body>

    <div class="modal-overlay">
        <div class="auth-modal">
            <div class="modal-left">
                <h2>Seja bem-vindo(a)</h2>
                <p>Para realizar as consultas é necessário preencher corretamente o formulário ao lado com os respectivos dados cadastrais.</p>
                <img src="assets/knowledge.png" alt="Ilustração">
            </div>

            <div class="modal-right">
                <button class="close-modal" type="button">&times;</button>
                <h1>Cadastrar</h1>
                <span>
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </span>

                <form>
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Nome de usuário">
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="Email">
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Senha">
                    </div>

                    <button class="submit-btn" type="submit">Cadastrar</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
