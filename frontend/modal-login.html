<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TechMind</title>


    <!-- Fonte Iceland -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Iceland&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS -->

    <link rel="stylesheet" href="modal-login.css">

</head>


<body>


    <!-- ========================= -->
    <!-- FUNDO / OVERLAY -->
    <!-- ========================= -->

    <div class="modal-overlay">


        <!-- ========================= -->
        <!-- MODAL -->
        <!-- ========================= -->

        <div class="auth-modal">


            <!-- ========================= -->
            <!-- LADO ESQUERDO -->
            <!-- ========================= -->

            <div class="modal-left">

                <h2>
                    Seja bem-vindo(a)
                </h2>


                <p>
                    Você pode fazer login e acessar
                    com a sua conta existente.
                </p>


                <img
                    src="https://github.com/No-Country-simulation/G9-BR-Team-19/blob/feature/frontend/frontend/assets/knowledge.png?raw=true"
                    alt="Ilustração"
                >

            </div>


            <!-- ========================= -->
            <!-- LADO DIREITO -->
            <!-- ========================= -->

            <div class="modal-right">


                <!-- Fechar -->

                <button
                    class="close-modal"
                    type="button"
                >
                    &times;
                </button>


                <h1>
                    Entrar
                </h1>


                <span>

                    Ainda não possui uma conta?

                    <a href="#">
                        Cadastrar
                    </a>

                </span>


                <form>


                    <!-- Usuário / Email -->

                    <div class="input-group">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            placeholder="Nome de usuário ou email"
                            autocomplete="username"
                        >

                    </div>


                    <!-- Senha -->

                    <div class="input-group">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Senha"
                            autocomplete="current-password"
                        >

                    </div>


                    <!-- Login -->

                    <button
                        class="submit-btn"
                        type="submit"
                    >
                        Login
                    </button>


                </form>

            </div>

        </div>

    </div>


</body>

</html>
