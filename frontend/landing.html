<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>TechMind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="background">

    <main>

                <img src="assets/ai.png" alt="AI Brain">

        <button class="start">
            Comece Aqui
        </button>
