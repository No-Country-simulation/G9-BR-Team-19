<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-wrapper">
        <header class="header">
            <div class="logo">
                <img src="assets/brain.png" alt="Logo" class="logo-icon">
                <span class="techmind-title">TechMind</span>
            </div>

            <nav class="nav-tabs">
                <button class="tab-btn active" data-target="tab-nova-analise">Nova Análise</button>
                <button class="tab-btn" data-target="tab-bibliotech">Bibliotech</button>
                <button class="tab-btn" data-target="tab-metricas">Métricas</button>
            </nav>

            <div class="user-area">
                <button id="btn-login-modal" class="btn-user">
                    Usuário
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="content-container">
                <h2 class="main-title">Organização Inteligente de <span class="highlight">Conhecimento Técnico</span></h2>
                <p class="subtitle">Preencha as informações necessárias para organizar seus textos, facilitando sua classificação, consulta e reutilização</p>
            </div>

            <div class="dashboard-card">
                    <form id="form-analise">

                        <div class="form-group">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" placeholder="Digite aqui o título...">
                        </div>

                        <div class="form-group">
                        <label for="conteudo">Texto</label>
                        <textarea id="conteudo" placeholder="Digite aqui o texto..."></textarea>
                        </div>

                        <button type="submit" id="btn-consultar">Consultar</button>

                    </form>
                    </div>
        </main>
    </div>

  <script src="app.js"></script>
</body>
</html>
